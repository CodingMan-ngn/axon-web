<!DOCTYPE html>
<html>
<head>
    <title>Axon - Get Key</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #111; border: 1px solid #222; padding: 40px; border-radius: 12px; width: 400px; text-align: center; }
        h2 { margin-top: 0; }
        .key-display { background: #000; border: 1px solid #333; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 18px; color: #4caf50; margin: 20px 0; word-break: break-all; }
        button { width: 100%; padding: 12px; background: white; color: black; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .btn-ad { background: #4caf50; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Axon Access</h2>
        <p style="color: #888; font-size: 14px;">Generate your license key below.</p>
        
        <div id="key-section">
            <button onclick="generateKey()">Generate New Key</button>
        </div>

        <div id="reward-section" class="hidden">
            <div class="key-display" id="key-text">AXON-XXXX-XXXX</div>
            <button onclick="copyKey()" style="background: #333; color: white; margin-bottom: 10px;">Copy Key</button>
            
            <p style="color: #888; font-size: 14px; margin-top: 20px;">Need time? Complete an ad.</p>
            <button class="btn-ad" onclick="earnTime()">Complete BoostyLink Task</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://axon-api.l26064135.workers.dev';
        let currentKey = '';

        async function generateKey() {
            document.getElementById('key-section').classList.add('hidden');
            document.getElementById('reward-section').classList.remove('hidden');
            document.getElementById('key-text').innerText = 'Generating...';

            const res = await fetch(API_URL + '/generate', { method: 'POST' });
            const data = await res.json();
            
            currentKey = data.key;
            document.getElementById('key-text').innerText = currentKey;
        }

        function copyKey() {
            navigator.clipboard.writeText(currentKey);
            alert('Key copied to clipboard! Paste it into the Axon injector.');
        }

        function earnTime() {
            const boostyUrl = `https://boostylink.com/YOUR_LINK?key=${currentKey}`;
            window.location.href = boostyUrl;
        }
    </script>
</body>
</html>
